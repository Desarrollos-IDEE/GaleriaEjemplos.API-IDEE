<!DOCTYPE html>
<html>

<head>

    <meta name="cnig" content="yes">
    <title>Zoom</title>
    <!-- Estilo de la API -->
    <link type="text/css" rel="stylesheet" href="https://componentes.cnig.es/api-core/assets/css/apiign.ol.min.css">

    <style type="text/css">
        html,
        body {
            margin: 0;
            padding: 0;
            height: 100%;
            overflow: hidden;
        }
    </style>
</head>

<body>
    <!-- Contenedor principal del mapa -->
    <div id="mapjs" class="m-container"></div>
    <!-- Ficheros javascript de la API -->
    <script type="text/javascript" src="https://componentes.cnig.es/api-core/vendor/browser-polyfill.js"></script>
    <script type="text/javascript" src="https://componentes.cnig.es/api-core/js/apiign.ol.min.js"></script>
    <script type="text/javascript" src="https://componentes.cnig.es/api-core/js/configuration.js"></script>


    <script type="text/javascript">
        // Configuración del mapa
        const mapjs = M.map({
            container: 'mapjs', //id del contenedor del mapa
            zoom: 7,
            center: [-467062.8225, 4683459.6216],
        });
        // Configuración de las capas
        //Capa punto
        const punto = new M.layer.GeoJSON({
            name: "Punto",
            source: {
                "type": "FeatureCollection",
                "features": [
                    {
                        "type": "Feature",
                        "id": "temp_1681819953694.1681819957816",
                        "geometry": {
                            "type": "Point",
                            "coordinates": [
                                -6.026838207273456,
                                36.489457102963826
                            ]
                        },
                        "properties": {}
                    },
                    {
                        "type": "Feature",
                        "id": "temp_1681820669059.1681820675794",
                        "geometry": {
                            "type": "LineString",
                            "coordinates": [
                                [
                                    -6.784894847898456,
                                    37.576931925409056
                                ],
                                [
                                    -4.543683910398455,
                                    38.528530348922374
                                ],
                                [
                                    -5.060041332273456,
                                    37.35020468180723
                                ],
                                [
                                    -2.752912426023455,
                                    38.28747987157581
                                ],
                                [
                                    -3.225324535398456,
                                    37.24532960800482
                                ],
                                [
                                    -1.225812816648455,
                                    38.29610265771595
                                ],
                                [
                                    -1.2477854728984543,
                                    38.27885606091664
                                ]
                            ]
                        },
                        "properties": {}
                    },
                    {
                        "type": "Feature",
                        "id": "temp_1681885857129.1681885870986",
                        "geometry": {
                            "type": "Polygon",
                            "coordinates": [
                                [
                                    [
                                        -5.657958984375004,
                                        40.30047607974953
                                    ],
                                    [
                                        -5.657958984375004,
                                        40.30047607974953
                                    ],
                                    [
                                        -4.9328613281250036,
                                        42.36260292172
                                    ],
                                    [
                                        -0.7580566406250043,
                                        38.878204997061545
                                    ],
                                    [
                                        2.4499511718749956,
                                        40.55137419871522
                                    ],
                                    [
                                        -6.8225097656250036,
                                        38.06971703320488
                                    ],

                                        0.010986328124995517,

                                    ],

                                    ],

                                    ],

                                        -5.657958984375004,
                                        40.30047607974953
                                    ]
                                ]
                            ]
                        },
                        "properties": {}
                    },
                ]
            },

            extract: false

        });
        //Creo los estilos 
        const estilo1 = new M.style.Generic({
            point: {
                // Definición atributos para puntos
                radius: 7,

                fill: {
                    color: 'purple',
                    opacity: 0.3,//Transparencia del punto
                },
                //Borde exterior
                stroke: {
                    color: '#D358F7',
                    width: 0.3,
                    width: 2, // Grosor en pixeles
                    linedash: [5, 5, 20], // Patrón de distancias
                    linedashoffset: 1, // Offset de fase
                    linecap: 'square', // Estilo de final de línea. round (borde redondeado)|square(borde cuadrado ligeramente alargado)|butt(borde cuadrado afilado)
                    linejoin: 'miter', // Estilo de conexión de segmentos. miter(inglete)|round(redondo)|bevel(bisel)
                    miterlimit: 15, // Tamaño máximo segmento de conexión
                    opacity: 1,
                },
            },
            polygon: {
                // Definición atributos para polígonos
                // Polígono rosa semitransparente con borde rojo de grosor dos
                fill: {
                    color: 'A9F5F2',
                    opacity: 0.5,
                },
                stroke: {
                    color: '#01DFD7',
                    width: 2
                }
            },
            line: {
                // Definición atributos para líneas
                fill: {
                    color: 'red',
                    opacity: 0.7,
                },
                stroke: {
                    color: '#FF0000',
                    width: 0.9
                }

            }
        });

        // Configuracion de estilos 
        punto.setStyle(estilo1);
        //Añadir capa al mapa
        mapjs.addLayers(punto);

    </script>
